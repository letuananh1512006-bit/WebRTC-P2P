<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-fixed": "#8ffa9b", "on-primary": "#ffffff", "error": "#ba1a1a", "on-tertiary": "#ffffff", "background": "#f7f9ff", "on-tertiary-fixed": "#002108", "on-tertiary-container": "#000701", "on-secondary-fixed-variant": "#930004", "on-secondary-container": "#fffbff", "inverse-surface": "#2d3135", "tertiary": "#006d2a", "surface-container-lowest": "#ffffff", "on-primary-fixed-variant": "#004493", "surface-container-high": "#e5e8ee", "surface-container": "#ebeef4", "on-error": "#ffffff", "secondary": "#b51b15", "surface-tint": "#005bc0", "on-secondary-fixed": "#410001", "tertiary-container": "#16893a", "secondary-fixed": "#ffdad5", "on-primary-container": "#ffffff", "error-container": "#ffdad6", "surface-bright": "#f7f9ff", "on-secondary": "#ffffff", "surface-dim": "#d7dae0", "on-background": "#181c20", "surface": "#f7f9ff", "primary-fixed": "#d8e2ff", "on-tertiary-fixed-variant": "#00531e", "outline": "#727785", "on-surface": "#181c20", "on-error-container": "#93000a", "surface-container-highest": "#dfe3e8", "on-surface-variant": "#414754", "inverse-on-surface": "#eef1f7", "secondary-fixed-dim": "#ffb4a9", "outline-variant": "#c1c6d6", "tertiary-fixed-dim": "#73dc82", "secondary-container": "#d9372b", "primary": "#005bbf", "primary-fixed-dim": "#adc7ff", "on-primary-fixed": "#001a41", "surface-container-low": "#f1f4fa", "inverse-primary": "#adc7ff", "surface-variant": "#dfe3e8", "primary-container": "#1a73e8" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-lg": "1.5rem", "margin": "1.5rem", "space-sm": "0.5rem", "space-md": "1rem", "space-xl": "2rem", "gutter": "1rem", "space-xs": "0.25rem" }, "fontFamily": { "headline-xl": ["Inter"], "headline-lg": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "headline-xl-mobile": ["Inter"], "headline-md": ["Inter"], "body-sm": ["Inter"], "label-md": ["Inter"], "label-lg": ["Inter"], "body-md": ["Inter"] }, "fontSize": { "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "600" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-xl-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "500" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }] } } } };</script></head><body class="min-h-screen bg-surface font-body-md text-body-md text-on-surface flex flex-col justify-between selection:bg-primary-fixed selection:text-on-primary-fixed"><header class="w-full py-space-md px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"></div></header><main class="w-full flex-1 flex items-center justify-center px-gutter py-space-xl"><div class="flex flex-col w-full items-center justify-center relative">
<div class="absolute -top-16 -left-12 w-96 h-96 bg-primary-fixed/30 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="absolute -bottom-20 -right-10 w-96 h-96 bg-surface-container-high/40 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="w-full max-w-md mx-auto">
<div class="bg-surface-container-lowest rounded-2xl shadow-xl p-8 sm:p-10 transition-all duration-300">
<div class="flex flex-col items-center text-center">
<div class="w-14 h-14 rounded-2xl bg-primary-fixed flex items-center justify-center mb-3 transition-transform hover:scale-105 duration-200">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: &quot;FILL&quot; 1;">video_camera_front</span>
</div>
<span class="font-headline-md text-headline-md text-on-surface font-semibold tracking-tight">WebRTC P2P</span>
<h1 class="font-headline-lg text-headline-lg text-on-surface font-bold tracking-tight mt-2" id="form-heading">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1" id="form-subheading">Sign in to continue to your academic video sessions</p>
</div>
<form class="mt-8 space-y-5" id="auth-form">
<div class="hidden space-y-1.5 transition-all duration-200" id="name-field-group">
<label class="block font-label-md text-label-md text-on-surface-variant font-medium" for="fullName">Full Name</label>
<div class="relative">
<input class="w-full px-3.5 py-2.5 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md outline-none focus:bg-surface-container-lowest transition-all" id="fullName" name="fullName" placeholder="Prof. Alex Rivera" type="text">
<span class="material-symbols-outlined absolute right-3 top-2.5 text-outline text-[20px] pointer-events-none">badge</span>
</div>
</div>
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface-variant font-medium" for="email">Academic Email</label>
<div class="relative">
<input class="w-full px-3.5 py-2.5 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md outline-none focus:bg-surface-container-lowest transition-all" id="email" name="email" placeholder="name@university.edu" required="" type="email" value="alex.rivera@university.edu">
<span class="material-symbols-outlined absolute right-3 top-2.5 text-outline text-[20px] pointer-events-none">alternate_email</span>
</div>
</div>
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface-variant font-medium" for="password">Password</label>
<div class="relative">
<input class="w-full px-3.5 py-2.5 pr-10 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md outline-none focus:bg-surface-container-lowest transition-all" id="password" name="password" placeholder="••••••••••••" required="" type="password" value="secure_peer_mesh_2025">
<button aria-label="Toggle password visibility" class="absolute right-2.5 top-2 p-1 text-outline hover:text-on-surface transition-colors flex items-center justify-center rounded-full" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-1" id="credentials-helper">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-primary bg-surface-container-low focus:ring-0 cursor-pointer" id="remember" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant">Remember this device</span>
</label>
<button class="font-label-md text-label-md text-primary font-medium hover:underline focus:outline-none" onclick="handleForgotPassword()" type="button">
            Forgot password?
          </button>
</div>
<button class="w-full py-3 px-4 bg-primary text-on-primary font-label-lg text-label-lg rounded-xl shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer active:scale-[0.99]" id="submit-btn" type="submit">
<span id="submit-text" class="">Sign in to Peer Mesh</span>
<span class="material-symbols-outlined text-[20px]" id="submit-icon">login</span>
<span class="hidden material-symbols-outlined animate-spin text-[20px]" id="submit-spinner">progress_activity</span>
</button>
</form>
<div class="relative my-6 text-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full bg-surface-container-high h-[1px]"></div>
</div>
<span class="relative bg-surface-container-lowest px-3 font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">or peer authorization</span>
</div>
<div class="space-y-3">
<button class="w-full py-2.5 px-4 bg-surface-container-low hover:bg-surface-container text-on-surface font-label-md text-label-md rounded-xl transition-colors flex items-center justify-center gap-3" onclick="ssoLogin('University Shibboleth')" type="button">
<span class="material-symbols-outlined text-primary text-[20px]">account_balance</span>
<span class="">Sign in with University SSO</span>
</button>
</div>
<div class="mt-6 text-center">
<span class="font-body-sm text-body-sm text-on-surface-variant" id="auth-switch-prompt">Don't have an academic peer ID?</span>
<button class="ml-1 font-label-md text-label-md text-primary font-semibold hover:underline focus:outline-none" id="auth-toggle-btn" onclick="toggleAuthMode()" type="button">
          Create account
        </button>
</div>
</div>
<div class="mt-6 flex flex-col items-center gap-3 px-4 text-center">


</div>
</div>
<div class="fixed bottom-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none" id="toast">
<div class="bg-inverse-surface text-inverse-on-surface px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-3">
<span class="material-symbols-outlined text-tertiary-fixed text-[20px]" id="toast-icon">check_circle</span>
<span class="font-body-md text-body-md" id="toast-message">Notice message</span>
</div>
</div>
</div>
<script>
  let isSignUpMode = false;

  function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    const msgEl = document.getElementById('toast-message');
    const iconEl = document.getElementById('toast-icon');
    
    msgEl.innerText = message;
    if (isError) {
      iconEl.innerText = 'error';
      iconEl.className = 'material-symbols-outlined text-secondary-fixed-dim text-[20px]';
    } else {
      iconEl.innerText = 'check_circle';
      iconEl.className = 'material-symbols-outlined text-tertiary-fixed text-[20px]';
    }
    
    toast.classList.remove('translate-y-20', 'opacity-0');
    toast.classList.add('translate-y-0', 'opacity-100');
    
    setTimeout(() => {
      toast.classList.remove('translate-y-0', 'opacity-100');
      toast.classList.add('translate-y-20', 'opacity-0');
    }, 3200);
  }

  function togglePasswordVisibility() {
    const passInput = document.getElementById('password');
    const toggleIcon = document.getElementById('password-toggle-icon');
    
    if (passInput.type === 'password') {
      passInput.type = 'text';
      toggleIcon.innerText = 'visibility_off';
    } else {
      passInput.type = 'password';
      toggleIcon.innerText = 'visibility';
    }
  }

  function toggleAuthMode() {
    isSignUpMode = !isSignUpMode;
    
    const heading = document.getElementById('form-heading');
    const subheading = document.getElementById('form-subheading');
    const nameGroup = document.getElementById('name-field-group');
    const submitText = document.getElementById('submit-text');
    const submitIcon = document.getElementById('submit-icon');
    const helperRow = document.getElementById('credentials-helper');
    const switchPrompt = document.getElementById('auth-switch-prompt');
    const toggleBtn = document.getElementById('auth-toggle-btn');
    
    if (isSignUpMode) {
      heading.innerText = 'Join Peer Mesh';
      subheading.innerText = 'Register your node to start secure university peer streams';
      nameGroup.classList.remove('hidden');
      helperRow.classList.add('hidden');
      submitText.innerText = 'Initialize Peer Node';
      submitIcon.innerText = 'how_to_reg';
      switchPrompt.innerText = 'Already have an academic peer ID?';
      toggleBtn.innerText = 'Sign in';
      showToast('Switched to Node Registration mode');
    } else {
      heading.innerText = 'Welcome back';
      subheading.innerText = 'Sign in to continue to your academic video sessions';
      nameGroup.classList.add('hidden');
      helperRow.classList.remove('hidden');
      submitText.innerText = 'Sign in to Peer Mesh';
      submitIcon.innerText = 'login';
      switchPrompt.innerText = "Don't have an academic peer ID?";
      toggleBtn.innerText = 'Create account';
    }
  }

  function handleForgotPassword() {
    showToast('Reset link dispatched to registered institution directory.');
  }

  function ssoLogin(provider) {
    showToast('Redirecting to University Institutional Identity Provider...');
    setTimeout(() => {
      window.location.href = '#';
    }, 1000);
  }

  function handleAuthSubmit(event) {
    event.preventDefault();
  }
</script>
<script type="module" src="./dist/login.js"></script>
</main><footer class="w-full py-space-md px-margin text-center font-body-sm text-body-sm text-on-surface-variant flex flex-col sm:flex-row items-center justify-between gap-space-xs"><div class="flex items-center gap-space-md"></div></footer>

</body></html>
